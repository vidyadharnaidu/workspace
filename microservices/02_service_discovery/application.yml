# ---------- the registry itself ----------
server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  client:
    register-with-eureka: false     # the registry does not register with itself...
    fetch-registry: false           # ...and does not fetch a registry from anyone
  server:
    enable-self-preservation: false # false in dev so dead instances disappear fast; leave TRUE in prod

